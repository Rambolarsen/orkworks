<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="890" viewBox="0 0 1000 890" role="img" aria-labelledby="title desc"><title id="title">Proposed changed-plan and missing-plan previews</title><desc id="desc">Two narrow layouts: changed plan A to B preserves the old instruction as stale and offers refresh. Missing-plan alternative states no plan selected and leaves plan review unavailable. Neither action sends terminal input.</desc>
