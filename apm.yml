name: orkworks
version: 1.0.0
description: APM project for orkworks
author: Lars-Erik
# Which agent platforms to deploy to.
# Resolution order: --target flag > this field > auto-detect from filesystem.
# Accepted values: copilot, claude, cursor, opencode, codex, gemini, windsurf, all
targets:
  - claude
  - codex
  - copilot
  - opencode
dependencies:
  apm:
    - obra/superpowers#bb92a77741419a4ab5f06e711a283343f1ada0c3 # v7.0.0
    - git: DietrichGebert/ponytail#24b0b98e16f5c66de296654f2cb480c22ea8debc # v4.2.0
      targets: [copilot, opencode]
    - thedotmack/claude-mem#88ebc949f90af6509d780f9975661e4fae18efe2 # v14.0.1
    - leonardomso/rust-skills#fd2a861ab0406a4ac536a55274d14ea6fd1ca9c9
    - git: mattpocock/skills#24fe0ef7737efae15c87225755e9f6f5965e4888 # v1.3.1
      skills:
        - codebase-design
        - grilling
        - improve-codebase-architecture
    - git: addyosmani/agent-skills#aeac41d4d005999432bb7312f7ff06383a91d59d # 0.6.13
      skills:
        - context-engineering
        - doubt-driven-development
includes: auto
scripts: {}
lifecycle:
  post-install:
    - type: command
      description: Remove the incompatible Superpowers SessionStart hook from Codex
      command: bash scripts/repair-codex-session-start-hooks.sh
      timeoutSec: 30
  post-update:
    - type: command
      description: Remove the incompatible Superpowers SessionStart hook from Codex
      command: bash scripts/repair-codex-session-start-hooks.sh
      timeoutSec: 30
