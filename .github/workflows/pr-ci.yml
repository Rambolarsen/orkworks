name: PR CI

"on":
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  docs:
    name: Documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: docs
      - run: node --test docs/.vitepress/site-facts.test.mjs scripts/docs-audit-scope.test.mjs
      - run: pnpm docs:build
        working-directory: docs

  changes:
    name: Detect changed surfaces
    runs-on: ubuntu-latest
    outputs:
      desktop_changed: ${{ steps.filter.outputs.desktop }}
      rust_changed: ${{ steps.filter.outputs.rust }}
      windows_inference_changed: ${{ steps.filter.outputs.windows_inference }}
      windows_ownership_changed: ${{ steps.filter.outputs.windows_ownership }}
      relevant_code_changed: ${{ steps.filter.outputs.desktop == 'true' || steps.filter.outputs.rust == 'true' || steps.filter.outputs.windows_ownership == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            desktop:
              - 'apps/desktop/**'
            rust:
              - 'crates/orkworksd/**'
              - 'rust-toolchain.toml'
            windows_inference:
              - 'crates/orkworksd/**'
              - 'rust-toolchain.toml'
              - '.github/workflows/pr-ci.yml'
            windows_ownership:
              - 'crates/process-ownership-fixture/**'
              - 'rust-toolchain.toml'
              - '.github/workflows/pr-ci.yml'

      - name: Print routing decision
        run: |
          echo "desktop_changed=${{ steps.filter.outputs.desktop }}"
          echo "rust_changed=${{ steps.filter.outputs.rust }}"
          echo "windows_ownership_changed=${{ steps.filter.outputs.windows_ownership }}"

  desktop:
    name: Desktop
    needs: changes
    if: needs.changes.outputs.desktop_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "11"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Type-check desktop
        working-directory: apps/desktop
        run: npx tsc --noEmit

      - name: Run desktop tests
        working-directory: apps/desktop
        run: node --experimental-strip-types --test tests/*.test.ts tests/*.test.mjs

      - name: Build desktop
        working-directory: apps/desktop
        run: pnpm build

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/orkworksd

      - name: Check Rust formatting
        run: cargo fmt --manifest-path crates/orkworksd/Cargo.toml --check

      - name: Run Rust tests
        run: cargo test --manifest-path crates/orkworksd/Cargo.toml

  windows-inference:
    name: Windows custom inference
    needs: changes
    if: needs.changes.outputs.windows_inference_changed == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RUST_TEST_THREADS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/orkworksd
      - name: Test native custom inference transport
        shell: pwsh
        run: |
          $listed = cargo test --locked --manifest-path crates/orkworksd/Cargo.toml --bin orkworksd -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $required = @(
            "providers::custom_inference::transport_tests::custom_inference_transports_stdin_and_file_with_literal_argv_and_existing_login",
            "providers::custom_inference::transport_tests::custom_inference_cleans_up_failures_and_bounds_output_and_runtime",
            "providers::custom_inference::transport_tests::custom_inference_rejects_invalid_utf8_instead_of_repairing_response_bytes",
            "providers::custom_inference::transport_tests::custom_inference_does_not_classify_provider_stderr_as_runner_timeout",
            "taskmaster::context::tests::configured_exclusions_accept_native_separators_and_sensitive_directory_case",
            "taskmaster::runtime::selection_tests::settings_status_exposes_the_canonical_workspace_override_key",
            "taskmaster::evaluator::activation_tests::unapproved_custom_evaluation_never_starts_a_child_or_spends_usage",
            "taskmaster::evaluator::activation_tests::activation_requires_approval_then_persists_grounded_custom_output",
            "taskmaster::evaluator::activation_tests::custom_evaluation_failures_spend_one_reservation_without_recommendations",
            "taskmaster::evaluator::activation_tests::custom_evaluation_rechecks_readiness_before_context_and_reservation",
            "taskmaster::evaluator::activation_tests::custom_evaluation_discards_output_revoked_while_child_is_running",
            "taskmaster::evaluator::activation_tests::custom_evaluation_recovers_after_reapproval_or_reenable",
            "taskmaster::inference_trust::identity::tests::defaulted_identity_is_stable_but_execution_changes_invalidate_it",
            "workspace_runtime::tests::native_identity_rejects_missing_windows_identity_parts"
          )
          foreach ($test in $required) {
            if ($listed -notcontains "$($test): test") { throw "Missing required Windows test: $test" }
          }
      - name: Run native custom inference transport
        run: cargo test --locked --manifest-path crates/orkworksd/Cargo.toml custom_inference
      - name: Test approval-gated evaluation
        run: cargo test --locked --manifest-path crates/orkworksd/Cargo.toml activation_tests
      - name: Test inference trust persistence and identity
        run: cargo test --locked --manifest-path crates/orkworksd/Cargo.toml inference_trust
      - name: Test Windows context exclusions and workspace settings
        run: |
          cargo test --locked --manifest-path crates/orkworksd/Cargo.toml taskmaster::context
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path crates/orkworksd/Cargo.toml taskmaster::runtime::selection_tests
      - name: Test native workspace identity on Windows
        run: cargo test --locked --manifest-path crates/orkworksd/Cargo.toml workspace_runtime

  windows-process-ownership:
    name: Windows process ownership fixture
    needs: changes
    if: needs.changes.outputs.windows_ownership_changed == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/process-ownership-fixture
      - name: Record native Windows runner and architecture
        shell: pwsh
        run: |
          Write-Host "runner.os=$env:RUNNER_OS"
          Write-Host "runner.arch=$env:RUNNER_ARCH"
          rustc -vV
      - name: Require the focused Windows suite to discover tests
        shell: pwsh
        run: |
          $listed = cargo test --locked --manifest-path crates/process-ownership-fixture/Cargo.toml --test windows_job -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $discovered = @($listed | Where-Object { $_ -match ': test$' })
          if ($discovered.Count -eq 0) { throw "windows_job discovered zero tests" }
          Write-Host "windows_job.discovered=$($discovered.Count)"
      - name: Run native Windows Job Object proof
        run: cargo test --locked --manifest-path crates/process-ownership-fixture/Cargo.toml --test windows_job

  noop:
    name: No relevant code changes
    needs: changes
    if: needs.changes.outputs.relevant_code_changed != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explain skip
        run: echo "No desktop or Rust changes detected; skipping code validation."

  doc-drift:
    name: Doc drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for doc drift
        run: |
          OUTPUT=$(bash scripts/doc-check.sh "origin/${GITHUB_BASE_REF}...HEAD")
          if [ -n "$OUTPUT" ]; then
            echo "$OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Check branch-protection policy guidance
        run: bash scripts/branch-protection-policy-check.sh
