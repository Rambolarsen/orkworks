name: Main CI

# Validate affected surfaces on main pushes, and both full suites daily,
# on manual dispatch, and when releases call this workflow at an immutable SHA.

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 5 * * *" # daily 05:00 UTC
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        description: "Immutable commit to validate; event SHA when omitted"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed surfaces
    runs-on: ubuntu-latest
    outputs:
      desktop_changed: ${{ github.event_name != 'push' || inputs.source_sha != '' || github.event.before == '0000000000000000000000000000000000000000' || steps.filter.outputs.desktop == 'true' }}
      rust_changed: ${{ github.event_name != 'push' || inputs.source_sha != '' || github.event.before == '0000000000000000000000000000000000000000' || steps.filter.outputs.rust == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - id: filter
        if: github.event_name == 'push' && inputs.source_sha == '' && github.event.before != '0000000000000000000000000000000000000000'
        uses: dorny/paths-filter@v3
        with:
          # Compare immutable event SHAs, including every commit in the push.
          base: ${{ github.event.before }}
          ref: ${{ github.sha }}
          filters: .github/ci-paths.yml

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop_changed == 'true'
    name: Desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: "11"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Type-check desktop
        working-directory: apps/desktop
        run: npx tsc --noEmit

      - name: Verify native Electron ABI repair
        working-directory: apps/desktop
        run: pnpm test:native

      - name: Run desktop tests
        working-directory: apps/desktop
        run: node --experimental-strip-types --test tests/*.test.ts tests/*.test.mjs

      - name: Build desktop
        working-directory: apps/desktop
        run: pnpm build

  rust:
    needs: changes
    if: needs.changes.outputs.rust_changed == 'true'
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: "11"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install Electron knowledge test dependencies for host Node
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/orkworksd

      - name: Run Rust tests
        run: cargo test --manifest-path crates/orkworksd/Cargo.toml

      - name: Test OpenCode session reporter
        run: node --test crates/orkworksd/scripts/opencode-session-reporter.test.mjs

      - name: Test POSIX harness reporter diagnostics
        run: bash crates/orkworksd/scripts/report-harness-event.test.sh
