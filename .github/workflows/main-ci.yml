name: Main CI

# Re-runs the full test suites against `main` itself, independent of PR CI.
# pr-ci.yml only triggers on `pull_request` and path-filters by changed
# surface — it never re-validates `main` after a merge, and an admin-bypass
# merge (branch protection allows this today) skips it entirely. This
# workflow closes that gap: every push to `main`, plus a daily schedule to
# catch drift with no code change (flaky tests, dependency updates).

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 5 * * *" # daily 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "11"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Type-check desktop
        working-directory: apps/desktop
        run: npx tsc --noEmit

      - name: Run desktop tests
        working-directory: apps/desktop
        run: node --experimental-strip-types --test tests/*.test.ts tests/*.test.mjs

      - name: Build desktop
        working-directory: apps/desktop
        run: pnpm build

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/orkworksd

      - name: Run Rust tests
        run: cargo test --manifest-path crates/orkworksd/Cargo.toml
