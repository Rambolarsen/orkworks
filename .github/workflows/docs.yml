# Builds the VitePress docs site and deploys it to GitHub Pages.
# Refreshes public facts on release publication and daily, as well as source changes.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'specs/**'
      - '.github/workflows/docs.yml'
      - 'crates/orkworksd/resources/harnesses-v2.json'
      - 'apps/desktop/package.json'
      - '.nvmrc'
  release:
    types: [published, edited, deleted]
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # release events must build the current site, not the tagged source
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: docs
      - run: pnpm docs:build
        working-directory: docs
        env:
          DOCS_FETCH_RELEASES: '1'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
