name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    environment: release
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: mac
            arch: arm64
          - os: windows-latest
            target: win
            arch: x64
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "11"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Guard tag/version drift
        shell: bash
        run: |
          TAG="$GITHUB_REF_NAME"
          PKG_VERSION="$(node -e "process.stdout.write('v' + require('./apps/desktop/package.json').version)")"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "Tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/orkworksd

      - name: Install frontend deps
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: apps/desktop
        run: pnpm build

      - name: Verify runner architecture
        shell: bash
        run: |
          ACTUAL_ARCH="$(node -p "process.arch")"
          if [ "$ACTUAL_ARCH" != "${{ matrix.arch }}" ]; then
            echo "Runner architecture $ACTUAL_ARCH does not match release target ${{ matrix.arch }}"
            exit 1
          fi

      - name: Prepare App Store Connect API key
        if: matrix.target == 'mac'
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/orkworks-app-store-connect.p8"
          cleanup() {
            rm -f -- "$KEY_PATH"
          }
          trap cleanup ERR INT TERM
          if [ -z "$APPLE_API_KEY_BASE64" ]; then
            echo "APPLE_API_KEY is required"
            exit 1
          fi
          umask 077
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          printf 'APPLE_API_KEY=%s\n' "$KEY_PATH" >> "$GITHUB_ENV"
          trap - ERR INT TERM

      - name: Package macOS (electron-builder)
        if: matrix.target == 'mac'
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            rm -f -- "$APPLE_API_KEY"
          }
          trap cleanup EXIT
          test -f "$APPLE_API_KEY"
          pnpm package:release
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Clean up App Store Connect API key
        if: ${{ always() && matrix.target == 'mac' }}
        shell: bash
        run: |
          if [ -n "${APPLE_API_KEY:-}" ]; then
            rm -f -- "$APPLE_API_KEY"
          fi

      - name: Package Windows (electron-builder)
        if: matrix.target == 'win'
        working-directory: apps/desktop
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_EXPECTED_PUBLISHER: ${{ vars.WIN_EXPECTED_PUBLISHER }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_EXPECTED_PUBLISHER)) {
            throw "WIN_EXPECTED_PUBLISHER is required"
          }
          if ($env:WIN_EXPECTED_PUBLISHER -ne $env:WIN_EXPECTED_PUBLISHER.Trim()) {
            throw "WIN_EXPECTED_PUBLISHER must be the exact certificate common name"
          }
          $env:CSC_LINK = $env:WIN_CSC_LINK
          $env:CSC_KEY_PASSWORD = $env:WIN_CSC_KEY_PASSWORD
          node -e @'
          const fs = require("node:fs");
          const yaml = require("js-yaml");
          const configPath = "electron-builder.yml";
          const config = yaml.load(fs.readFileSync(configPath, "utf8"));
          if (!Array.isArray(config.win?.publisherName) || config.win.publisherName.length !== 0) {
            throw new Error("electron-builder Windows publisher placeholder is invalid");
          }
          config.win.publisherName = [process.env.WIN_EXPECTED_PUBLISHER];
          fs.writeFileSync(configPath, yaml.dump(config, { lineWidth: -1 }));
          '@
          pnpm package:release

      - name: Verify packaged artifact
        working-directory: apps/desktop
        run: pnpm verify:release:pre-checksum

      - name: Verify native macOS signatures
        if: matrix.target == 'mac'
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          RELEASE_DIR="$PWD/release"
          STAGED_APP="$RELEASE_DIR/mac-arm64/OrkWorks.app"
          DMG_PATH="$RELEASE_DIR/OrkWorks-${VERSION}-mac-arm64.dmg"
          ZIP_PATH="$RELEASE_DIR/OrkWorks-${VERSION}-mac-arm64.zip"
          TEMP_ROOT="$(mktemp -d)"
          MOUNT_DIR="$TEMP_ROOT/dmg"
          ZIP_DIR="$TEMP_ROOT/zip"
          MOUNTED=0

          verify_app() {
            local app_path="$1"
            codesign --verify --deep --strict --verbose=2 "$app_path"
            codesign --verify --deep --strict --verbose=2 "$app_path/Contents/Resources/orkworksd"
            spctl --assess --type execute --verbose=4 "$app_path"
            xcrun stapler validate "$app_path"
          }

          cleanup() {
            set +e
            if [ "$MOUNTED" -eq 1 ]; then
              hdiutil detach "$MOUNT_DIR"
            fi
            rm -rf "$TEMP_ROOT"
          }
          trap cleanup EXIT
          mkdir -p "$MOUNT_DIR" "$ZIP_DIR"

          verify_app "$STAGED_APP"
          hdiutil attach "$DMG_PATH" -readonly -nobrowse -mountpoint "$MOUNT_DIR"
          MOUNTED=1
          verify_app "$MOUNT_DIR/OrkWorks.app"
          hdiutil detach "$MOUNT_DIR"
          MOUNTED=0
          ditto -x -k "$ZIP_PATH" "$ZIP_DIR"
          verify_app "$ZIP_DIR/OrkWorks.app"

      - name: Verify native Windows signatures
        if: matrix.target == 'win'
        working-directory: apps/desktop
        shell: pwsh
        env:
          WIN_EXPECTED_PUBLISHER: ${{ vars.WIN_EXPECTED_PUBLISHER }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:WIN_EXPECTED_PUBLISHER)) {
            throw "WIN_EXPECTED_PUBLISHER is required"
          }

          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $releaseDir = (Resolve-Path release).Path
          $installer = Join-Path $releaseDir "OrkWorks-$version-win-x64.exe"
          $app = Join-Path $releaseDir "win-unpacked/OrkWorks.exe"
          $sidecar = Join-Path $releaseDir "win-unpacked/resources/orkworksd.exe"
          $appUpdate = Join-Path $releaseDir "win-unpacked/resources/app-update.yml"
          $signtoolPath = Get-ChildItem -Path "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/signtool.exe" |
            Sort-Object FullName |
            Select-Object -Last 1 -ExpandProperty FullName
          if (-not $signtoolPath) {
            throw "signtool.exe was not found"
          }

          foreach ($path in @($installer, $app, $sidecar)) {
            & $signtoolPath verify /pa /all /v $path
            if ($LASTEXITCODE -ne 0) {
              throw "signtool verification failed for $path"
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            if ($signature.Status -ne "Valid") {
              throw "Authenticode status $($signature.Status) for $path"
            }
            $publisher = if ($signature.SignerCertificate) {
              $signature.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
            }
            if ($publisher -ne $env:WIN_EXPECTED_PUBLISHER) {
              throw "Publisher mismatch for $path"
            }
          }

          $env:ORKWORKS_APP_UPDATE_PATH = $appUpdate
          node -e @'
          const fs = require("node:fs");
          const yaml = require("js-yaml");
          const metadata = yaml.load(fs.readFileSync(process.env.ORKWORKS_APP_UPDATE_PATH, "utf8"));
          if (
            !Array.isArray(metadata?.publisherName)
            || metadata.publisherName.length !== 1
            || metadata.publisherName[0] !== process.env.WIN_EXPECTED_PUBLISHER
          ) {
            process.exitCode = 1;
          }
          '@
          if ($LASTEXITCODE -ne 0) {
            throw "app-update.yml publisher identity mismatch"
          }

      - name: Smoke-test Windows installer
        if: matrix.target == 'win'
        working-directory: apps/desktop
        run: pnpm smoke:windows-installer
        env:
          WIN_EXPECTED_PUBLISHER: ${{ vars.WIN_EXPECTED_PUBLISHER }}
          ORKWORKS_INSTALLER_SMOKE_DIR: ${{ runner.temp }}\orkworks-installer-smoke-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Generate release checksums
        working-directory: apps/desktop
        run: pnpm checksum:release

      - name: Verify checksummed release artifact
        working-directory: apps/desktop
        run: pnpm verify:release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            apps/desktop/release/OrkWorks-*
            apps/desktop/release/latest*.yml
            apps/desktop/release/*.blockmap
            apps/desktop/release/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: false

      - name: Assemble release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/publish
          for artifact_dir in artifacts/release-mac-arm64 artifacts/release-win-x64; do
            find "$artifact_dir" -maxdepth 1 -type f \
              \( -name 'OrkWorks-*' -o -name 'latest*.yml' -o -name '*.blockmap' \) \
              -exec cp {} artifacts/publish/ \;
          done
          cat \
            artifacts/release-mac-arm64/SHA256SUMS.txt \
            artifacts/release-win-x64/SHA256SUMS.txt \
            | sort > artifacts/publish/SHA256SUMS.txt

      - name: Assert platform update metadata
        shell: bash
        run: |
          test -f artifacts/publish/latest-mac.yml
          test -f artifacts/publish/latest.yml

      - name: Publish draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/publish/*
          fail_on_unmatched_files: true
