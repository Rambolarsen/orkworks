# Shared PR and main-push routing. Keep dependency inputs with their consumers.
desktop:
  - '.vscode/launch.json'
  - 'docs/user/taskmaster.md'
  - '.github/workflows/release.yml'
  - 'apps/desktop/**'
  - 'crates/orkworksd/resources/**'
  - 'tests/fixtures/**'
  - '.nvmrc'
  - '.github/workflows/pr-ci.yml'
  - '.github/ci-paths.yml'
  - '.github/workflows/main-ci.yml'
rust:
  # Rust tests embed the desktop startup catalog for message parity.
  - 'apps/desktop/src/startupDiagnostics.ts'
  # Embedded knowledge and shared behavioral fixtures are Rust inputs too.
  - 'apps/desktop/resources/knowledge/**'
  - 'apps/desktop/tests/fixtures/**'
  - 'docs/validation/fixtures/**'
  - 'docs/validation/root-bootstrap-vectors.json'
  # Rust child-source tests execute the independent documentation parity assay.
  - 'scripts/child-source-parity-cases.mjs'
  - 'docs/validation/child-source-vectors.json'
  - 'docs/validation/child-source-components.mjs'
  - 'docs/validation/child-source-components.test.mjs'
  - 'docs/validation/generate-child-source-vectors.py'
  - 'docs/validation/root-bootstrap-components.mjs'
  - 'docs/validation/root-preparation-components.mjs'
  - 'docs/validation/root-preparation-source-components.mjs'
  - 'docs/validation/hierarchy-summary-components.mjs'
  - 'docs/validation/r2-report-components.mjs'
  - '.github/workflows/main-ci.yml'
  - 'crates/orkworksd/**'
  - 'rust-toolchain.toml'
  - '.nvmrc'
  - '.github/workflows/pr-ci.yml'
  - '.github/ci-paths.yml'
  - 'apps/desktop/electron/knowledge*.ts'
  - 'apps/desktop/electron/strictJson.ts'
  - 'apps/desktop/electron/taskmasterSettings.ts'
  - 'apps/desktop/tests/knowledge*.ts'
  - 'apps/desktop/tests/taskmasterSettings.test.ts'
  - 'apps/desktop/package.json'
  - 'apps/desktop/pnpm-lock.yaml'
  - 'apps/desktop/pnpm-workspace.yaml'
  - 'apps/desktop/.npmrc'
  - 'apps/desktop/scripts/setup-electron.mjs'
  - 'tests/fixtures/taskmaster-knowledge/**'
windows_inference:
  - 'crates/orkworksd/**'
  - 'rust-toolchain.toml'
  - '.github/workflows/pr-ci.yml'
  - '.github/ci-paths.yml'
windows_ownership:
  - 'crates/process-ownership-fixture/**'
  - 'rust-toolchain.toml'
  - '.github/workflows/pr-ci.yml'
  - '.github/ci-paths.yml'
review_diagnostics:
  - 'scripts/pr-review-*'
  - '.github/workflows/pr-review.yml'
  - '.github/workflows/pr-ci.yml'
  - '.github/ci-paths.yml'
local_analysis:
  - 'scripts/sonar*'
  - 'sonar-project.properties'
  - 'compose.sonar.yaml'
  - 'Containerfile'
  - '.github/workflows/pr-ci.yml'
  - '.github/ci-paths.yml'
native_session_app:
  - 'apps/desktop/electron/sessionAppOpener.ts'
  - 'apps/desktop/tests/sessionAppOpener.test.ts'
  - 'crates/orkworksd/resources/harnesses-v2.json'
  - '.nvmrc'
  - '.github/workflows/pr-ci.yml'
  - '.github/ci-paths.yml'
