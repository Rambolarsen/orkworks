appId: ai.orkworks.desktop
productName: OrkWorks
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - build/icon.png
  - build/icon-dark.png
  - build/icon.ico
  - build/icon-dark.ico
  - package.json
publish:
  provider: github
  owner: Rambolarsen
  repo: orkworks
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  notarize: true
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  binaries:
    - Contents/Resources/orkworksd
  forceCodeSigning: true
  artifactName: OrkWorks-${version}-mac-${arch}.${ext}
  extraResources:
    - from: ../../crates/orkworksd/target/release/orkworksd
      to: orkworksd
    - from: ../../crates/orkworksd/scripts
      to: scripts
    - from: resources/knowledge
      to: knowledge
dmg:
  writeUpdateInfo: false
win:
  target:
    - nsis
  publish:
    provider: github
    owner: Rambolarsen
    repo: orkworks
    publisherName: []
  verifyUpdateCodeSignature: true
  forceCodeSigning: true
  artifactName: OrkWorks-${version}-win-${arch}.${ext}
  extraResources:
    - from: ../../crates/orkworksd/target/release/orkworksd.exe
      to: orkworksd.exe
    - from: ../../crates/orkworksd/scripts
      to: scripts
    - from: resources/knowledge
      to: knowledge
linux:
  category: Development
  target:
    - AppImage
    - deb
  artifactName: OrkWorks-${version}-linux-${arch}.${ext}
  extraResources:
    - from: ../../crates/orkworksd/target/release/orkworksd
      to: orkworksd
    - from: ../../crates/orkworksd/scripts
      to: scripts
    - from: resources/knowledge
      to: knowledge
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
