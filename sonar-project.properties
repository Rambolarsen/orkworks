# Local snapshot analysis. scripts/sonar.py supplies project and source identity.
sonar.projectName=OrkWorks local analysis
sonar.sourceEncoding=UTF-8
sonar.sources=apps/desktop/src,apps/desktop/electron,crates/orkworksd/src
sonar.tests=apps/desktop/tests
sonar.exclusions=**/node_modules/**,**/target/**,**/dist/**,**/dist-electron/**,**/fixtures/**
sonar.test.inclusions=apps/desktop/tests/**
sonar.typescript.tsconfigPaths=apps/desktop/tsconfig.json,apps/desktop/tsconfig.node.json
sonar.rust.cargo.manifestPaths=crates/orkworksd/Cargo.toml
sonar.scm.disabled=true
